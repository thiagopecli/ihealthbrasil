name: Integracao Continua

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias de qualidade
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar formatacao com Black
        run: black --check .

      - name: Validar ordenacao de imports com Isort
        run: isort --check-only .

      - name: Flake8
        run: flake8 . --max-line-length=120 --extend-ignore=E203,W503 --exclude=.venv,migrations

      - name: Bandit
        run: bandit -q -c pyproject.toml -r .

      - name: Verificacao do Django
        if: hashFiles('manage.py') != ''
        run: python manage.py check

      - name: Testes do Django
        if: hashFiles('manage.py') != ''
        run: python manage.py test
